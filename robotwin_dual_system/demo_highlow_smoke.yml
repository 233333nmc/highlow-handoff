# Smoke-test variant of RoboTwin's pinned task_config/demo_clean.yml.
#
# Source revision: c3ddfa8b97d5519efa828b075999bd0006778e5e
# Keep this schema aligned with that checkout. The only behavioral changes from
# demo_clean are collect_data=false and eval_video_log=false so the integration
# smoke test does not emit trajectories or videos.

render_freq: 0
episode_num: 50
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: false
eval_video_log: false
