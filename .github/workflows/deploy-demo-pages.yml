name: Deploy high-level visual memory report

on:
  push:
    branches:
      - feature/high-level-visual-memory
      - highlow-handoff-baseline
      - main
    paths:
      - "docs/high-level-visual-memory-report/**"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload high-level visual memory report
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/high-level-visual-memory-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
